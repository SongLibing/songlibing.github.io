<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="950" viewBox="0 0 1060 950" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Helvetica Neue',sans-serif">
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.16"/>
    </filter>
    <marker id="arw" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748b"/>
    </marker>
    <marker id="arwA" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d97706"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1060" height="950" fill="#f8fafc"/>

  <!-- Title -->
  <text x="530" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#0f172a">MySQL-5.7 Online DDL：INSERT 一行记录时 Row Log 的记录路径</text>
  <text x="530" y="55" text-anchor="middle" font-size="13" fill="#475569">插入顺序恒为「聚簇索引 → 二级索引」；重建表在插聚簇索引时记 row log，创建索引在插二级索引时记 row log</text>

  <!-- ===== Shared entry chain (center 530) ===== -->
  <rect x="370" y="66" width="320" height="42" rx="8" fill="#eaf1fe" stroke="#3b73e0" stroke-width="1.5" filter="url(#sh)"/>
  <text x="530" y="92" text-anchor="middle" font-size="14" font-weight="600" fill="#17356b">row_insert_for_mysql()</text>

  <rect x="370" y="126" width="320" height="42" rx="8" fill="#eaf1fe" stroke="#3b73e0" stroke-width="1.5" filter="url(#sh)"/>
  <text x="530" y="152" text-anchor="middle" font-size="14" font-weight="600" fill="#17356b">row_ins_step() → row_ins()</text>

  <rect x="370" y="186" width="320" height="42" rx="8" fill="#eaf1fe" stroke="#3b73e0" stroke-width="1.5" filter="url(#sh)"/>
  <text x="530" y="212" text-anchor="middle" font-size="14" font-weight="600" fill="#17356b">row_ins_index_entry_step()　［遍历每个索引］</text>

  <rect x="370" y="246" width="320" height="42" rx="8" fill="#eaf1fe" stroke="#3b73e0" stroke-width="1.5" filter="url(#sh)"/>
  <text x="530" y="272" text-anchor="middle" font-size="14" font-weight="600" fill="#17356b">row_ins_index_entry()　［按 is_clustered 分发］</text>

  <line x1="530" y1="108" x2="530" y2="125" stroke="#64748b" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="530" y1="168" x2="530" y2="185" stroke="#64748b" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="530" y1="228" x2="530" y2="245" stroke="#64748b" stroke-width="1.6" marker-end="url(#arw)"/>

  <!-- split arrows -->
  <line x1="530" y1="288" x2="278" y2="347" stroke="#64748b" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="530" y1="288" x2="782" y2="347" stroke="#64748b" stroke-width="1.6" marker-end="url(#arw)"/>

  <!-- ordering pill -->
  <rect x="420" y="303" width="220" height="24" rx="12" fill="#fff" stroke="#94a3b8" stroke-width="1"/>
  <text x="530" y="319" text-anchor="middle" font-size="11.5" font-weight="600" fill="#334155">① 聚簇索引　先　②　后 二级索引</text>

  <!-- ============ LEFT branch : Clustered (rebuild table) ============ -->
  <text x="270" y="330" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">聚簇索引分支</text>

  <rect x="120" y="350" width="300" height="42" rx="8" fill="#eafaf0" stroke="#2e9e5b" stroke-width="1.5" filter="url(#sh)"/>
  <text x="270" y="376" text-anchor="middle" font-size="13.5" font-weight="600" fill="#14532d">row_ins_clust_index_entry()</text>

  <rect x="120" y="412" width="300" height="42" rx="8" fill="#eafaf0" stroke="#2e9e5b" stroke-width="1.5" filter="url(#sh)"/>
  <text x="270" y="438" text-anchor="middle" font-size="13.5" font-weight="600" fill="#14532d">row_ins_clust_index_entry_low()</text>

  <rect x="120" y="474" width="300" height="48" rx="8" fill="#eafaf0" stroke="#2e9e5b" stroke-width="1.5" filter="url(#sh)"/>
  <text x="270" y="494" text-anchor="middle" font-size="13.5" font-weight="600" fill="#14532d">插入聚簇索引 B-tree</text>
  <text x="270" y="512" text-anchor="middle" font-size="11" font-family="monospace" fill="#3f6b52">btr_cur_optimistic / pessimistic_insert()</text>

  <rect x="120" y="544" width="300" height="50" rx="8" fill="#fff4d6" stroke="#f59e0b" stroke-width="2" filter="url(#sh)"/>
  <text x="270" y="565" text-anchor="middle" font-size="14.5" font-weight="700" fill="#8a5a00">★ row_log_table_insert()</text>
  <text x="270" y="583" text-anchor="middle" font-size="10.5" fill="#a06a12">if dict_index_is_online_ddl(聚簇索引)</text>

  <!-- L document (online_log) -->
  <path d="M190,648 L324,648 L350,674 L350,744 L190,744 Z" fill="#fff8e6" stroke="#d97706" stroke-width="1.5" filter="url(#sh)"/>
  <path d="M324,648 L324,674 L350,674 Z" fill="#fce4ba" stroke="#d97706" stroke-width="1.5"/>
  <line x1="210" y1="700" x2="330" y2="700" stroke="#e2c58a" stroke-width="1"/>
  <text x="270" y="692" text-anchor="middle" font-size="13" font-weight="700" fill="#7c4a04">聚簇索引 online_log</text>
  <text x="270" y="722" text-anchor="middle" font-size="10.5" fill="#8a5a00">记录整行</text>
  <text x="270" y="736" text-anchor="middle" font-size="10.5" fill="#8a5a00">（含外溢列指针）</text>

  <line x1="270" y1="392" x2="270" y2="411" stroke="#64748b" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="270" y1="454" x2="270" y2="473" stroke="#64748b" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="270" y1="522" x2="270" y2="543" stroke="#64748b" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="270" y1="594" x2="270" y2="647" stroke="#d97706" stroke-width="1.8" marker-end="url(#arwA)"/>
  <text x="286" y="536" text-anchor="start" font-size="10" fill="#15803d">插入成功后记日志</text>

  <!-- scenario tag left -->
  <rect x="120" y="768" width="300" height="40" rx="8" fill="#ecfdf3" stroke="#2e9e5b" stroke-width="1.2"/>
  <text x="270" y="786" text-anchor="middle" font-size="12" font-weight="700" fill="#14532d">重建表场景</text>
  <text x="270" y="801" text-anchor="middle" font-size="10.5" fill="#3f6b52">ADD/DROP PRIMARY KEY · OPTIMIZE · 改 ROW_FORMAT</text>

  <!-- ============ RIGHT branch : Secondary (create index) ============ -->
  <text x="790" y="330" text-anchor="middle" font-size="13" font-weight="700" fill="#4a1d7a">二级索引分支</text>

  <rect x="640" y="350" width="300" height="42" rx="8" fill="#f6eefe" stroke="#9333ea" stroke-width="1.5" filter="url(#sh)"/>
  <text x="790" y="376" text-anchor="middle" font-size="13.5" font-weight="600" fill="#4a1d7a">row_ins_sec_index_entry()</text>

  <rect x="640" y="412" width="300" height="42" rx="8" fill="#f6eefe" stroke="#9333ea" stroke-width="1.5" filter="url(#sh)"/>
  <text x="790" y="438" text-anchor="middle" font-size="13.5" font-weight="600" fill="#4a1d7a">row_ins_sec_index_entry_low()</text>

  <rect x="640" y="474" width="300" height="50" rx="8" fill="#fff4d6" stroke="#f59e0b" stroke-width="2" filter="url(#sh)"/>
  <text x="790" y="494" text-anchor="middle" font-size="13.5" font-weight="700" fill="#8a5a00">★ row_log_online_op_try()</text>
  <text x="790" y="512" text-anchor="middle" font-size="12" font-weight="600" fill="#8a5a00">→ row_log_online_op()</text>

  <!-- R document (online_log) -->
  <path d="M710,648 L844,648 L870,674 L870,744 L710,744 Z" fill="#fff8e6" stroke="#d97706" stroke-width="1.5" filter="url(#sh)"/>
  <path d="M844,648 L844,674 L870,674 Z" fill="#fce4ba" stroke="#d97706" stroke-width="1.5"/>
  <line x1="730" y1="700" x2="850" y2="700" stroke="#e2c58a" stroke-width="1"/>
  <text x="790" y="692" text-anchor="middle" font-size="13" font-weight="700" fill="#7c4a04">二级索引 online_log</text>
  <text x="790" y="722" text-anchor="middle" font-size="10.5" fill="#8a5a00">记录二级</text>
  <text x="790" y="736" text-anchor="middle" font-size="10.5" fill="#8a5a00">索引项（entry）</text>

  <line x1="790" y1="392" x2="790" y2="411" stroke="#64748b" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="790" y1="454" x2="790" y2="473" stroke="#64748b" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="790" y1="524" x2="790" y2="647" stroke="#d97706" stroke-width="1.8" marker-end="url(#arwA)"/>
  <text x="806" y="468" text-anchor="start" font-size="10" fill="#7c3aed">if 索引在线创建中</text>

  <!-- fallthrough caption (right of the amber arrow) -->
  <text x="808" y="560" text-anchor="start" font-size="10.5" fill="#4a1d7a">返回 false 时继续插二级 B-tree</text>
  <text x="808" y="575" text-anchor="start" font-size="10.5" font-family="monospace" fill="#6d28d9">btr_cur_optimistic/pessimistic_insert()</text>
  <text x="808" y="590" text-anchor="start" font-size="10.5" fill="#4a1d7a">返回 true 则转日志、跳过插入</text>

  <!-- scenario tag right -->
  <rect x="640" y="768" width="300" height="40" rx="8" fill="#faf5ff" stroke="#9333ea" stroke-width="1.2"/>
  <text x="790" y="786" text-anchor="middle" font-size="12" font-weight="700" fill="#4a1d7a">创建二级索引场景</text>
  <text x="790" y="801" text-anchor="middle" font-size="10.5" fill="#6d28d9">ADD INDEX · CREATE INDEX（不重建表）</text>

  <!-- ===== Legend ===== -->
  <rect x="120" y="824" width="820" height="82" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="140" y="846" font-size="12.5" font-weight="700" fill="#334155">图例</text>
  <rect x="140" y="858" width="26" height="16" rx="4" fill="#fff4d6" stroke="#f59e0b" stroke-width="2"/>
  <text x="174" y="870" font-size="11.5" fill="#475569">★ 记录 row log 的函数点（两种 DDL 各一处，位置不同）</text>
  <path d="M140,888 L160,888 L166,894 L166,906 L140,906 Z" fill="#fff8e6" stroke="#d97706" stroke-width="1.3"/>
  <path d="M160,888 L160,894 L166,894 Z" fill="#fce4ba" stroke="#d97706" stroke-width="1.3"/>
  <text x="176" y="900" font-size="11.5" fill="#475569">该索引的 online_log（日志文件缓冲）</text>
  <line x1="560" y1="869" x2="588" y2="869" stroke="#64748b" stroke-width="1.6" marker-end="url(#arw)"/>
  <text x="596" y="873" font-size="11.5" fill="#475569">函数调用 / 流程走向</text>
  <text x="560" y="898" font-size="11.5" fill="#475569">关键区别：重建表记在<tspan font-weight="700" fill="#14532d">聚簇索引插入</tspan>处，创建索引记在<tspan font-weight="700" fill="#4a1d7a">二级索引插入</tspan>处</text>

  <text x="530" y="934" text-anchor="middle" font-size="11" fill="#94a3b8">InnoDB · MySQL-5.7</text>
</svg>
