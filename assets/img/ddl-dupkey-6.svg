<svg xmlns="http://www.w3.org/2000/svg" width="866" height="548" viewBox="0 0 866 548" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Helvetica Neue',sans-serif">
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.16"/>
    </filter>
    <marker id="arw" markerWidth="11" markerHeight="11" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748b"/></marker>
    <marker id="arwA" markerWidth="11" markerHeight="11" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#d97706"/></marker>
  </defs>

  <rect x="0" y="0" width="866" height="548" fill="#f8fafc"/>

  <text x="433" y="24" text-anchor="middle" font-size="14.5" font-weight="700" fill="#0f172a">Row Log 回放：时序 · map（Dup Key 跳过表）· 三索引两快照</text>
  <text x="433" y="41" text-anchor="middle" font-size="9.5" fill="#475569">t(c1,c2,c3)：PK=c1、uk(c2)、idx(c3)，初始 (1,1,1)、(2,2,2)；INSERT(3,2,2)→不一致，DELETE(pk3)→一致</text>

  <!-- ============ LEFT: timeline ============ -->
  <line x1="20" y1="112" x2="20" y2="486" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#arw)"/>
  <text x="20" y="104" text-anchor="middle" font-size="9" fill="#94a3b8">时间</text>

  <text x="36" y="106" font-size="11" font-weight="700" fill="#334155">① 回放 INSERT(3,2,2)</text>
  <rect x="34" y="116" width="210" height="30" rx="7" fill="#eafaf0" stroke="#2e9e5b" stroke-width="1.3" filter="url(#sh)"/>
  <text x="46" y="135" font-size="11" fill="#14532d"><tspan font-weight="700">1a</tspan> 聚簇：插入 (3,2,2) ✓</text>

  <rect x="34" y="162" width="210" height="40" rx="7" fill="#fff4d6" stroke="#f59e0b" stroke-width="1.7" filter="url(#sh)"/>
  <text x="46" y="179" font-size="11" fill="#8a5a00"><tspan font-weight="700">1b</tspan> 唯一：撞 c2=2 <tspan fill="#b91c1c" font-weight="700">失败</tspan></text>
  <text x="46" y="195" font-size="10.5" font-weight="700" fill="#a06a12">　 → 写入 map</text>

  <rect x="34" y="218" width="210" height="30" rx="7" fill="#eafaf0" stroke="#2e9e5b" stroke-width="1.3" filter="url(#sh)"/>
  <text x="46" y="237" font-size="11" fill="#14532d"><tspan font-weight="700">1c</tspan> 非唯一：插入 ✓</text>

  <text x="36" y="332" font-size="11" font-weight="700" fill="#334155">② 回放 DELETE(pk=3)</text>
  <rect x="34" y="346" width="210" height="30" rx="7" fill="#eafaf0" stroke="#2e9e5b" stroke-width="1.3" filter="url(#sh)"/>
  <text x="46" y="365" font-size="11" fill="#14532d"><tspan font-weight="700">2a</tspan> 聚簇：删除 pk3 ✓</text>

  <rect x="34" y="392" width="210" height="40" rx="7" fill="#fff4d6" stroke="#f59e0b" stroke-width="1.7" filter="url(#sh)"/>
  <text x="46" y="409" font-size="11" fill="#8a5a00"><tspan font-weight="700">2b</tspan> 唯一：查 map <tspan font-weight="700">命中</tspan></text>
  <text x="46" y="425" font-size="10.5" font-weight="700" fill="#a06a12">　 → 跳过删除</text>

  <rect x="34" y="448" width="210" height="30" rx="7" fill="#eafaf0" stroke="#2e9e5b" stroke-width="1.3" filter="url(#sh)"/>
  <text x="46" y="467" font-size="11" fill="#14532d"><tspan font-weight="700">2c</tspan> 非唯一：删除 ✓</text>

  <line x1="139" y1="146" x2="139" y2="161" stroke="#64748b" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="139" y1="202" x2="139" y2="217" stroke="#64748b" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="139" y1="248" x2="139" y2="318" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="4,4" marker-end="url(#arw)"/>
  <line x1="139" y1="376" x2="139" y2="391" stroke="#64748b" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="139" y1="432" x2="139" y2="447" stroke="#64748b" stroke-width="1.6" marker-end="url(#arw)"/>

  <!-- ============ MID: map (standalone) ============ -->
  <rect x="300" y="282" width="132" height="88" rx="9" fill="#fffaf0" stroke="#ea7a2c" stroke-width="1.7" filter="url(#sh)"/>
  <rect x="300" y="282" width="132" height="22" rx="9" fill="#ea7a2c"/>
  <text x="366" y="298" text-anchor="middle" font-size="10.5" font-weight="700" fill="#fff">map（Dup Key）</text>
  <rect x="316" y="314" width="100" height="24" rx="5" fill="#fff" stroke="#ea7a2c" stroke-width="1.1"/>
  <text x="366" y="331" text-anchor="middle" font-size="11" font-weight="700" font-family="monospace" fill="#7c4a04">(pk3, uk_c)</text>
  <text x="366" y="358" text-anchor="middle" font-size="9" fill="#8a5a00">记录待跳过项</text>

  <!-- write: 1b -> map (phase 1) -->
  <path d="M244,182 L366,182 L366,281" fill="none" stroke="#d97706" stroke-width="1.8" stroke-dasharray="6,3" marker-end="url(#arwA)"/>
  <text x="368" y="175" text-anchor="middle" font-size="9.5" font-weight="700" fill="#b45309">① INSERT 阶段 · 写入</text>

  <!-- read: map -> 2b (phase 2) -->
  <path d="M366,370 L366,410 L246,410" fill="none" stroke="#d97706" stroke-width="1.8" stroke-dasharray="6,3" marker-end="url(#arwA)"/>
  <text x="368" y="424" text-anchor="middle" font-size="9.5" font-weight="700" fill="#b45309">② DELETE 阶段 · 读取</text>

  <!-- ============ RIGHT: Snapshot A ============ -->
  <text x="470" y="106" font-size="11" font-weight="700" fill="#b45309">快照 A · INSERT 后 → ⚠ 不一致</text>

  <rect x="470" y="116" width="116" height="146" rx="9" fill="#ffffff" stroke="#3b73e0" stroke-width="1.4" filter="url(#sh)"/>
  <text x="481" y="136" font-size="11" font-weight="700" fill="#17356b">聚簇·c1</text>
  <line x1="479" y1="143" x2="577" y2="143" stroke="#e2e8f0" stroke-width="1"/>
  <text x="483" y="166" font-size="11" font-family="monospace" fill="#334155">(1,1,1)</text>
  <text x="483" y="188" font-size="11" font-family="monospace" fill="#334155">(2,2,2)</text>
  <text x="483" y="210" font-size="11" font-weight="700" font-family="monospace" fill="#a06a12">(3,2,2)</text>
  <text x="483" y="242" font-size="9" fill="#64748b">3 条·新增</text>

  <rect x="600" y="116" width="116" height="146" rx="9" fill="#ffffff" stroke="#9333ea" stroke-width="1.4" filter="url(#sh)"/>
  <text x="611" y="136" font-size="11" font-weight="700" fill="#4a1d7a">唯一·c2</text>
  <line x1="609" y1="143" x2="707" y2="143" stroke="#e2e8f0" stroke-width="1"/>
  <text x="613" y="166" font-size="11" font-family="monospace" fill="#334155">c2=1·pk1</text>
  <text x="613" y="188" font-size="11" font-family="monospace" fill="#334155">c2=2·pk2</text>
  <text x="613" y="226" font-size="9" fill="#b91c1c">共 2 条 · 缺 pk3</text>
  <text x="613" y="241" font-size="9" fill="#94a3b8">1b 撞键未插入</text>

  <rect x="730" y="116" width="116" height="146" rx="9" fill="#ffffff" stroke="#2e9e5b" stroke-width="1.4" filter="url(#sh)"/>
  <text x="741" y="136" font-size="11" font-weight="700" fill="#14532d">非唯一·c3</text>
  <line x1="739" y1="143" x2="837" y2="143" stroke="#e2e8f0" stroke-width="1"/>
  <text x="743" y="166" font-size="11" font-family="monospace" fill="#334155">c3=1·pk1</text>
  <text x="743" y="188" font-size="11" font-family="monospace" fill="#334155">c3=2·pk2</text>
  <text x="743" y="210" font-size="11" font-weight="700" font-family="monospace" fill="#a06a12">c3=2·pk3</text>
  <text x="743" y="242" font-size="9" fill="#64748b">3 条·新增</text>

  <line x1="654" y1="264" x2="654" y2="344" stroke="#64748b" stroke-width="1.7" marker-end="url(#arw)"/>
  <text x="669" y="308" font-size="10" font-weight="700" fill="#334155">DELETE 回放</text>

  <!-- ============ RIGHT: Snapshot B ============ -->
  <text x="470" y="340" font-size="11" font-weight="700" fill="#15803d">快照 B · DELETE 后 → ✓ 一致</text>

  <rect x="470" y="350" width="116" height="140" rx="9" fill="#ffffff" stroke="#3b73e0" stroke-width="1.4" filter="url(#sh)"/>
  <text x="481" y="369" font-size="11" font-weight="700" fill="#17356b">聚簇·c1</text>
  <line x1="479" y1="376" x2="577" y2="376" stroke="#e2e8f0" stroke-width="1"/>
  <text x="483" y="398" font-size="11" font-family="monospace" fill="#334155">(1,1,1)</text>
  <text x="483" y="419" font-size="11" font-family="monospace" fill="#334155">(2,2,2)</text>
  <text x="483" y="440" font-size="11" font-family="monospace" fill="#b0b7c0" text-decoration="line-through">(3,2,2)</text>
  <text x="483" y="468" font-size="9" fill="#64748b">2a 已删</text>

  <rect x="600" y="350" width="116" height="140" rx="9" fill="#ffffff" stroke="#9333ea" stroke-width="1.4" filter="url(#sh)"/>
  <text x="611" y="369" font-size="11" font-weight="700" fill="#4a1d7a">唯一·c2</text>
  <line x1="609" y1="376" x2="707" y2="376" stroke="#e2e8f0" stroke-width="1"/>
  <text x="613" y="398" font-size="11" font-family="monospace" fill="#334155">c2=1·pk1</text>
  <text x="613" y="419" font-size="11" font-family="monospace" fill="#334155">c2=2·pk2</text>
  <text x="613" y="447" font-size="9" fill="#64748b">2b 跳过</text>
  <text x="613" y="462" font-size="9" fill="#94a3b8">pk3 从未插入</text>

  <rect x="730" y="350" width="116" height="140" rx="9" fill="#ffffff" stroke="#2e9e5b" stroke-width="1.4" filter="url(#sh)"/>
  <text x="741" y="369" font-size="11" font-weight="700" fill="#14532d">非唯一·c3</text>
  <line x1="739" y1="376" x2="837" y2="376" stroke="#e2e8f0" stroke-width="1"/>
  <text x="743" y="398" font-size="11" font-family="monospace" fill="#334155">c3=1·pk1</text>
  <text x="743" y="419" font-size="11" font-family="monospace" fill="#334155">c3=2·pk2</text>
  <text x="743" y="440" font-size="11" font-family="monospace" fill="#b0b7c0" text-decoration="line-through">c3=2·pk3</text>
  <text x="743" y="468" font-size="9" fill="#64748b">2c 已删</text>

  <!-- conclusion -->
  <rect x="34" y="498" width="812" height="42" rx="9" fill="#fff7ed" stroke="#d97706" stroke-width="1.3"/>
  <text x="440" y="516" text-anchor="middle" font-size="10.5" font-weight="700" fill="#7c4a04">唯一索引撞 Dup Key：① 回放阶段把 (pk,索引名) 写入 map；② 回放阶段删该索引前查 map，命中即跳过</text>
  <text x="440" y="532" text-anchor="middle" font-size="9" fill="#8a5a00">否则删除时唯一索引上找不到 pk3 的项、回放失败 —— map 让快照 A 的不一致在快照 B 收敛为一致</text>
</svg>
