<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="600" viewBox="0 0 1040 600" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif">
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.16"/>
    </filter>
    <marker id="arw" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748b"/>
    </marker>
    <marker id="arwA" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d97706"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1040" height="600" fill="#f8fafc"/>

  <text x="520" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">A Failed INSERT Writes Two Row Log Entries</text>
  <text x="520" y="53" text-anchor="middle" font-size="12.5" fill="#475569">During a table-rebuild online DDL, DML hits the clustered B+tree first, then the secondary; the secondary fails → rollback → a delete is logged</text>

  <!-- ===== Left: execution flow ===== -->
  <rect x="40" y="84" width="500" height="44" rx="8" fill="#eaf1fe" stroke="#3b73e0" stroke-width="1.5" filter="url(#sh)"/>
  <text x="290" y="111" text-anchor="middle" font-size="14" font-weight="600" fill="#17356b">INSERT one row (table-rebuild online DDL in progress)</text>

  <rect x="40" y="150" width="500" height="56" rx="8" fill="#eafaf0" stroke="#2e9e5b" stroke-width="1.5" filter="url(#sh)"/>
  <text x="290" y="173" text-anchor="middle" font-size="14" font-weight="700" fill="#14532d">① Insert into the clustered B+tree　—　succeeds ✓</text>
  <text x="290" y="192" text-anchor="middle" font-size="11" font-family="monospace" fill="#3f6b52">row_ins_clust_index_entry_low() → row_log_table_insert()</text>

  <rect x="40" y="238" width="500" height="56" rx="8" fill="#fdecec" stroke="#dc2626" stroke-width="1.6" filter="url(#sh)"/>
  <text x="290" y="261" text-anchor="middle" font-size="14" font-weight="700" fill="#7f1d1d">② Insert into the secondary B+tree　—　fails ✗</text>
  <text x="290" y="280" text-anchor="middle" font-size="11.5" fill="#9b2c2c">e.g. a unique-key conflict → DB_DUPLICATE_KEY</text>

  <rect x="40" y="326" width="500" height="44" rx="8" fill="#fff4d6" stroke="#f59e0b" stroke-width="1.6" filter="url(#sh)"/>
  <text x="290" y="353" text-anchor="middle" font-size="14" font-weight="700" fill="#8a5a00">③ DML rollback (undo drives the reverse B+tree ops)</text>

  <rect x="40" y="402" width="500" height="56" rx="8" fill="#eafaf0" stroke="#2e9e5b" stroke-width="1.5" filter="url(#sh)"/>
  <text x="290" y="425" text-anchor="middle" font-size="13.5" font-weight="700" fill="#14532d">④ Undo the clustered insert　—　remove the record</text>
  <text x="290" y="444" text-anchor="middle" font-size="11" font-family="monospace" fill="#3f6b52">row_undo_ins_remove_clust_rec() → row_log_table_delete()</text>

  <!-- flow arrows -->
  <line x1="290" y1="128" x2="290" y2="149" stroke="#64748b" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="290" y1="206" x2="290" y2="237" stroke="#64748b" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="290" y1="294" x2="290" y2="325" stroke="#64748b" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="290" y1="370" x2="290" y2="401" stroke="#64748b" stroke-width="1.6" marker-end="url(#arw)"/>

  <!-- ===== Right: row log document ===== -->
  <path d="M560,120 L972,120 L1000,148 L1000,550 L560,550 Z" fill="#fff8e6" stroke="#d97706" stroke-width="1.6" filter="url(#sh)"/>
  <path d="M972,120 L972,148 L1000,148 Z" fill="#fce4ba" stroke="#d97706" stroke-width="1.6"/>
  <text x="780" y="147" text-anchor="middle" font-size="14" font-weight="700" fill="#7c4a04">Row Log (clustered index online_log)</text>
  <text x="780" y="166" text-anchor="middle" font-size="10.5" fill="#8a5a00">Appended in order · one entry = one logical B+tree op</text>

  <!-- entry 1 -->
  <rect x="588" y="196" width="384" height="52" rx="6" fill="#eafaf0" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="780" y="220" text-anchor="middle" font-size="15" font-weight="700" font-family="monospace" fill="#14532d">&lt; ROW_T_INSERT, pk1, … &gt;</text>
  <text x="780" y="238" text-anchor="middle" font-size="10.5" fill="#3f6b52">Entry 1 · written when the clustered insert succeeds</text>

  <!-- entry 2 -->
  <rect x="588" y="406" width="384" height="52" rx="6" fill="#fdecec" stroke="#dc2626" stroke-width="1.4"/>
  <text x="780" y="430" text-anchor="middle" font-size="15" font-weight="700" font-family="monospace" fill="#7f1d1d">&lt; ROW_T_DELETE, pk1 &gt;</text>
  <text x="780" y="448" text-anchor="middle" font-size="10.5" fill="#9b2c2c">Entry 2 · written when rollback removes that record</text>

  <!-- order arrow inside doc -->
  <line x1="780" y1="248" x2="780" y2="405" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#arw)"/>
  <text x="792" y="330" text-anchor="start" font-size="10.5" fill="#64748b">time / append order</text>

  <!-- net effect note -->
  <text x="780" y="492" text-anchor="middle" font-size="11" font-weight="600" fill="#7c4a04">Net effect: pk1 is inserted, then deleted</text>
  <text x="780" y="509" text-anchor="middle" font-size="11" fill="#8a5a00">→ after the log is applied, pk1 is absent from the new table</text>
  <text x="780" y="533" text-anchor="middle" font-size="10.5" fill="#a06a12">which matches the state left by the DML rollback</text>

  <!-- log-write arrows (flow -> doc) -->
  <line x1="540" y1="178" x2="587" y2="216" stroke="#d97706" stroke-width="1.8" stroke-dasharray="5,3" marker-end="url(#arwA)"/>
  <text x="548" y="182" text-anchor="start" font-size="10" fill="#b45309">write row log</text>
  <line x1="540" y1="430" x2="587" y2="430" stroke="#d97706" stroke-width="1.8" stroke-dasharray="5,3" marker-end="url(#arwA)"/>
  <text x="548" y="422" text-anchor="start" font-size="10" fill="#b45309">write row log</text>

  <!-- ===== bottom-left: why ===== -->
  <rect x="40" y="478" width="500" height="96" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="58" y="500" font-size="12.5" font-weight="700" fill="#334155">Why must the second entry be logged?</text>
  <text x="58" y="520" font-size="11.5" fill="#475569">By the time the rollback runs, the DDL apply thread may already</text>
  <text x="58" y="538" font-size="11.5" fill="#475569">have applied entry 1, &lt;ROW_T_INSERT&gt;, to the new table. Logging</text>
  <text x="58" y="556" font-size="11.5" fill="#475569">&lt;ROW_T_DELETE&gt; is what clears that phantom row and keeps the new</text>
  <text x="58" y="568" font-size="11.5" fill="#475569" font-weight="600">table in sync (source comment: “log the removal, so it will be purged”).</text>

  <text x="520" y="592" text-anchor="middle" font-size="10.5" fill="#94a3b8">InnoDB · same logic in MySQL 5.7 and 8.0</text>
</svg>
