<svg xmlns="http://www.w3.org/2000/svg" width="880" height="544" viewBox="0 0 880 544" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Helvetica Neue',sans-serif">
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.16"/>
    </filter>
    <marker id="arw" markerWidth="11" markerHeight="11" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748b"/></marker>
    <marker id="arwA" markerWidth="11" markerHeight="11" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#d97706"/></marker>
  </defs>

  <rect x="0" y="0" width="880" height="544" fill="#f8fafc"/>

  <text x="440" y="24" text-anchor="middle" font-size="14.5" font-weight="700" fill="#0f172a">Row Log 回放：失败 UPDATE · map（Dup Key 跳过表）· 三索引两快照</text>
  <text x="440" y="41" text-anchor="middle" font-size="9.5" fill="#475569">初始 (1,1,1)、(2,2,2)；UPDATE t SET c2=2,c3=2 WHERE pk=1（pk1 (1,1,1)→(1,2,2)）撞 c2=2 失败，回滚后恢复</text>

  <!-- ============ LEFT: timeline ============ -->
  <line x1="20" y1="112" x2="20" y2="482" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#arw)"/>
  <text x="20" y="104" text-anchor="middle" font-size="9" fill="#94a3b8">时间</text>

  <text x="36" y="106" font-size="11" font-weight="700" fill="#334155">① 回放 UPDATE（正向）</text>
  <rect x="34" y="116" width="216" height="30" rx="7" fill="#eafaf0" stroke="#2e9e5b" stroke-width="1.3" filter="url(#sh)"/>
  <text x="46" y="135" font-size="11" fill="#14532d"><tspan font-weight="700">1a</tspan> 聚簇：(1,1,1)→(1,2,2) ✓</text>

  <rect x="34" y="162" width="216" height="40" rx="7" fill="#fff4d6" stroke="#f59e0b" stroke-width="1.7" filter="url(#sh)"/>
  <text x="46" y="179" font-size="11" fill="#8a5a00"><tspan font-weight="700">1b</tspan> 唯一：删旧 c2=1 ✓</text>
  <text x="46" y="195" font-size="10.5" font-weight="700" fill="#a06a12">　 插新 c2=2 <tspan fill="#b91c1c">失败</tspan> → 写 map</text>

  <rect x="34" y="218" width="216" height="30" rx="7" fill="#eafaf0" stroke="#2e9e5b" stroke-width="1.3" filter="url(#sh)"/>
  <text x="46" y="237" font-size="11" fill="#14532d"><tspan font-weight="700">1c</tspan> 非唯一：删 c3=1、插 c3=2 ✓</text>

  <text x="36" y="332" font-size="11" font-weight="700" fill="#334155">② 回放 UPDATE（回滚）</text>
  <rect x="34" y="346" width="216" height="30" rx="7" fill="#eafaf0" stroke="#2e9e5b" stroke-width="1.3" filter="url(#sh)"/>
  <text x="46" y="365" font-size="11" fill="#14532d"><tspan font-weight="700">2a</tspan> 聚簇：(1,2,2)→(1,1,1) ✓</text>

  <rect x="34" y="392" width="216" height="40" rx="7" fill="#fff4d6" stroke="#f59e0b" stroke-width="1.7" filter="url(#sh)"/>
  <text x="46" y="409" font-size="11" fill="#8a5a00"><tspan font-weight="700">2b</tspan> 唯一：查 map <tspan font-weight="700">命中</tspan> → 跳过删</text>
  <text x="46" y="425" font-size="10.5" font-weight="700" fill="#a06a12">　 插 c2=1（恢复原记录）</text>

  <rect x="34" y="448" width="216" height="30" rx="7" fill="#eafaf0" stroke="#2e9e5b" stroke-width="1.3" filter="url(#sh)"/>
  <text x="46" y="467" font-size="11" fill="#14532d"><tspan font-weight="700">2c</tspan> 非唯一：删 c3=2、插 c3=1 ✓</text>

  <line x1="142" y1="146" x2="142" y2="161" stroke="#64748b" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="142" y1="202" x2="142" y2="217" stroke="#64748b" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="142" y1="248" x2="142" y2="318" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="4,4" marker-end="url(#arw)"/>
  <line x1="142" y1="376" x2="142" y2="391" stroke="#64748b" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="142" y1="432" x2="142" y2="447" stroke="#64748b" stroke-width="1.6" marker-end="url(#arw)"/>

  <!-- ============ MID: map ============ -->
  <rect x="304" y="282" width="132" height="88" rx="9" fill="#fffaf0" stroke="#ea7a2c" stroke-width="1.7" filter="url(#sh)"/>
  <rect x="304" y="282" width="132" height="22" rx="9" fill="#ea7a2c"/>
  <text x="370" y="298" text-anchor="middle" font-size="10.5" font-weight="700" fill="#fff">map（Dup Key）</text>
  <rect x="320" y="314" width="100" height="24" rx="5" fill="#fff" stroke="#ea7a2c" stroke-width="1.1"/>
  <text x="370" y="331" text-anchor="middle" font-size="11" font-weight="700" font-family="monospace" fill="#7c4a04">(pk1, uk_c)</text>
  <text x="370" y="358" text-anchor="middle" font-size="9" fill="#8a5a00">插新失败·待跳过</text>

  <path d="M250,182 L370,182 L370,281" fill="none" stroke="#d97706" stroke-width="1.8" stroke-dasharray="6,3" marker-end="url(#arwA)"/>
  <text x="372" y="175" text-anchor="middle" font-size="9.5" font-weight="700" fill="#b45309">① 正向 · 写入</text>

  <path d="M370,370 L370,410 L252,410" fill="none" stroke="#d97706" stroke-width="1.8" stroke-dasharray="6,3" marker-end="url(#arwA)"/>
  <text x="372" y="424" text-anchor="middle" font-size="9.5" font-weight="700" fill="#b45309">② 回滚 · 读取</text>

  <!-- ============ RIGHT: Snapshot A ============ -->
  <text x="474" y="106" font-size="11" font-weight="700" fill="#b45309">快照 A · 正向后 → ⚠ 不一致</text>

  <rect x="474" y="116" width="118" height="124" rx="9" fill="#ffffff" stroke="#3b73e0" stroke-width="1.4" filter="url(#sh)"/>
  <text x="485" y="136" font-size="11" font-weight="700" fill="#17356b">聚簇·c1</text>
  <line x1="483" y1="143" x2="583" y2="143" stroke="#e2e8f0" stroke-width="1"/>
  <text x="487" y="166" font-size="11" font-weight="700" font-family="monospace" fill="#a06a12">(1,2,2)</text>
  <text x="487" y="188" font-size="11" font-family="monospace" fill="#334155">(2,2,2)</text>
  <text x="487" y="222" font-size="9" fill="#64748b">pk1 已更新</text>

  <rect x="606" y="116" width="118" height="124" rx="9" fill="#ffffff" stroke="#9333ea" stroke-width="1.4" filter="url(#sh)"/>
  <text x="617" y="136" font-size="11" font-weight="700" fill="#4a1d7a">唯一·c2</text>
  <line x1="615" y1="143" x2="715" y2="143" stroke="#e2e8f0" stroke-width="1"/>
  <text x="619" y="166" font-size="11" font-family="monospace" fill="#334155">c2=2·pk2</text>
  <text x="619" y="200" font-size="9" fill="#b91c1c">pk1 缺失</text>
  <text x="619" y="215" font-size="9" fill="#94a3b8">旧删·新失败</text>

  <rect x="738" y="116" width="118" height="124" rx="9" fill="#ffffff" stroke="#2e9e5b" stroke-width="1.4" filter="url(#sh)"/>
  <text x="749" y="136" font-size="11" font-weight="700" fill="#14532d">非唯一·c3</text>
  <line x1="747" y1="143" x2="847" y2="143" stroke="#e2e8f0" stroke-width="1"/>
  <text x="751" y="166" font-size="11" font-weight="700" font-family="monospace" fill="#a06a12">c3=2·pk1</text>
  <text x="751" y="188" font-size="11" font-family="monospace" fill="#334155">c3=2·pk2</text>
  <text x="751" y="222" font-size="9" fill="#64748b">pk1 已更新</text>

  <line x1="660" y1="248" x2="660" y2="324" stroke="#64748b" stroke-width="1.7" marker-end="url(#arw)"/>
  <text x="675" y="292" font-size="10" font-weight="700" fill="#334155">回滚 UPDATE</text>

  <!-- ============ RIGHT: Snapshot B ============ -->
  <text x="474" y="340" font-size="11" font-weight="700" fill="#15803d">快照 B · 回滚后 → ✓ 一致（恢复原值）</text>

  <rect x="474" y="350" width="118" height="112" rx="9" fill="#ffffff" stroke="#3b73e0" stroke-width="1.4" filter="url(#sh)"/>
  <text x="485" y="370" font-size="11" font-weight="700" fill="#17356b">聚簇·c1</text>
  <line x1="483" y1="377" x2="583" y2="377" stroke="#e2e8f0" stroke-width="1"/>
  <text x="487" y="400" font-size="11" font-weight="700" font-family="monospace" fill="#14532d">(1,1,1)</text>
  <text x="487" y="422" font-size="11" font-family="monospace" fill="#334155">(2,2,2)</text>
  <text x="487" y="452" font-size="9" fill="#15803d">pk1 已恢复</text>

  <rect x="606" y="350" width="118" height="112" rx="9" fill="#ffffff" stroke="#9333ea" stroke-width="1.4" filter="url(#sh)"/>
  <text x="617" y="370" font-size="11" font-weight="700" fill="#4a1d7a">唯一·c2</text>
  <line x1="615" y1="377" x2="715" y2="377" stroke="#e2e8f0" stroke-width="1"/>
  <text x="619" y="400" font-size="11" font-weight="700" font-family="monospace" fill="#14532d">c2=1·pk1</text>
  <text x="619" y="422" font-size="11" font-family="monospace" fill="#334155">c2=2·pk2</text>
  <text x="619" y="452" font-size="9" fill="#15803d">pk1 已恢复</text>

  <rect x="738" y="350" width="118" height="112" rx="9" fill="#ffffff" stroke="#2e9e5b" stroke-width="1.4" filter="url(#sh)"/>
  <text x="749" y="370" font-size="11" font-weight="700" fill="#14532d">非唯一·c3</text>
  <line x1="747" y1="377" x2="847" y2="377" stroke="#e2e8f0" stroke-width="1"/>
  <text x="751" y="400" font-size="11" font-weight="700" font-family="monospace" fill="#14532d">c3=1·pk1</text>
  <text x="751" y="422" font-size="11" font-family="monospace" fill="#334155">c3=2·pk2</text>
  <text x="751" y="452" font-size="9" fill="#15803d">pk1 已恢复</text>

  <!-- conclusion -->
  <rect x="34" y="492" width="822" height="42" rx="9" fill="#fff7ed" stroke="#d97706" stroke-width="1.3"/>
  <text x="445" y="510" text-anchor="middle" font-size="10.5" font-weight="700" fill="#7c4a04">失败 UPDATE = 每索引「删旧+插新」；c2 上删旧成功、插新撞键失败 → 写 map（记 pk 与索引名）</text>
  <text x="445" y="526" text-anchor="middle" font-size="9" fill="#8a5a00">回滚 UPDATE 时对 c2 查 map 命中 → 跳过删（该新值本未插入）、只插回旧值 c2=1 → 把原记录恢复出来，达到一致</text>
</svg>
