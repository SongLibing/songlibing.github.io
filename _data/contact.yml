#  The contact options.

- type: github
  icon: "fab fa-github"

- type: email
  icon: "fas fa-envelope"
  noblank: true # open link in current tab

# 中文 RSS 订阅源（侧边栏底部会显示带 CN 标识的图标）
- type: rss-cn
  icon: "fas fa-rss"
  url: "/feed-zh.xml"
  noblank: true

# 英文 RSS 订阅源（侧边栏底部会显示带 EN 标识的图标）
- type: rss-en
  icon: "fas fa-rss"
  url: "/feed-en.xml"
  noblank: true
